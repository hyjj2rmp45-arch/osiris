# Worker log rotation config
# Place at /etc/logrotate.d/osiris-worker on worker host if available,
# otherwise manage via worker restart and external log tooling.

/app/logs/*.log {
  daily
  rotate 14
  maxsize 100M
  compress
  delaycompress
  missingok
  notifempty
  create 0640 node node
  sharedscripts
  postrotate
    # optional: signal worker to reopen log handles if supported
  endscript
}
