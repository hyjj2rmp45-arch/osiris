name: Security Gates

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  schedule:
    - cron: '0 0 * * 1' # Weekly Monday midnight

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run TypeScript check
        run: npx tsc --noEmit
      - name: Run ESLint
        run: pnpm exec eslint src/ --ext .js,.jsx,.ts,.tsx || echo "ESLint warnings (non-blocking)"
      - name: Run Prettier check
        run: pnpm exec prettier --check src/ || echo "Prettier warnings (non-blocking)"
      - name: Run build
        run: pnpm build || echo "Build step warning (non-blocking)"

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        run: |
          pnpm audit --audit-level=high || echo "Dependency audit: vulnerabilities found (see report)"
          mkdir -p docs

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded secrets
        run: |
          if grep -rE "(private_key|secret_key|api_key|password|token|AUTH|SECRET)\s*[:=]\s*['\"][^'\\\"]{10,}['\"]" src/ .github/ --include="*.ts" --include="*.tsx" --include="*.js" --exclude-dir=node_modules 2>/dev/null; then
            echo "⚠️  Potential hardcoded secrets detected"
          else
            echo "✅ No obvious hardcoded secrets found"
          fi

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check for AGPL/GPL dependencies
        run: |
          if pnpm list --depth=0 --json 2>/dev/null | grep -E '"license":"(AGPL|GPL)"' > /dev/null 2>&1; then
            echo "⚠️  AGPL/GPL licensed dependencies found - review required"
          else
            echo "✅ No AGPL/GPL dependencies detected"
          fi
